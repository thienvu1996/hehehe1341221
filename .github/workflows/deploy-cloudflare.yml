name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing GitHub Actions secrets: CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply zalo-bot-db --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Smoke check public endpoints
        shell: bash
        run: |
          set -u
          BASE="https://bot.jean1331.io.vn"

          check_code() {
            local method="$1"
            local path="$2"
            local expected="$3"
            local body_file
            body_file="$(mktemp)"
            local code
            code=$(curl -sS -X "$method" -o "$body_file" -w "%{http_code}" "$BASE$path" || true)
            echo "$method $path -> HTTP $code"
            cat "$body_file" || true
            echo
            rm -f "$body_file"
            if [ "$code" != "$expected" ]; then
              echo "Unexpected status for $path: expected $expected, got $code"
              exit 1
            fi
          }

          check_code GET / 200
          check_code GET /health 200
          # If the runtime secrets exist, unauthenticated admin calls should be 403, not 500.
          check_code POST /admin/test-webhook 403
          check_code POST /admin/dashboard-session 403
