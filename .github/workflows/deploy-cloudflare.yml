name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing GitHub Actions secrets: CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply zalo-bot-db --remote

      - name: Deploy bot Worker
        run: npx wrangler deploy

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        env:
          NEXT_PUBLIC_BOT_API_URL: /api
        run: npm run build

      - name: Deploy dashboard Worker
        working-directory: dashboard
        run: npx wrangler deploy

      - name: Smoke check public endpoints
        shell: bash
        run: |
          set -u
          BASE="https://bot.jean1331.io.vn"
          DASHBOARD="https://dashboard.jean1331.io.vn"

          check_code() {
            local method="$1"
            local base="$2"
            local path="$3"
            local expected="$4"
            local body_file
            body_file="$(mktemp)"
            local code
            code=$(curl -sS -X "$method" -o "$body_file" -w "%{http_code}" "$base$path" || true)
            echo "$method $base$path -> HTTP $code"
            head -c 800 "$body_file" || true
            echo
            rm -f "$body_file"
            if [ "$code" != "$expected" ]; then
              echo "Unexpected status for $base$path: expected $expected, got $code"
              exit 1
            fi
          }

          check_code GET "$BASE" / 200
          check_code GET "$BASE" /health 200
          # Runtime secrets should exist: unauthenticated admin calls must be 403, never 500.
          check_code POST "$BASE" /admin/test-webhook 403
          check_code POST "$BASE" /admin/dashboard-session 403
          # Dashboard static Worker must be reachable after every deploy.
          check_code GET "$DASHBOARD" / 200
          # Same-origin dashboard API proxy must reach the bot Worker.
          check_code POST "$DASHBOARD" /api/admin/dashboard-session 403
